databases:
  - name: zcalib-db
    databaseName: zcalib
    user: zcalib
    plan: free

services:
  - type: web
    name: zcalib-project
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: zcalib-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: SESSION_TIMEOUT_DAYS
        value: 7
      - key: RATE_LIMIT_LOGIN
        value: 5
      - key: RATE_LIMIT_REGISTER
        value: 3
