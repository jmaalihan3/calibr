databases:
  - name: zcalib-db
    databaseName: zcalib
    user: zcalib
    plan: free

services:
  - type: web
    name: zcalib-project
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: zcalib-db
          property: connectionString
