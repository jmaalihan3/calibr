<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Assessment</title>
    <link rel="stylesheet" href="/styles.css">
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$']],
                displayMath: [['$$', '$$']]
            },
            startup: {
                pageReady: () => {
                    return MathJax.startup.defaultPageReady();
                }
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Academic Assessment System</h1>
        </header>

        <!-- Home Section: Landing page with start button -->
        <section id="home-section" class="section active">
            <div class="card">
                <h2>Welcome to the Assessment</h2>
                <p>Test your knowledge with a randomly generated exam.</p>
                
                <div style="margin: 20px 0;">
                    <label for="num-questions" style="display: block; margin-bottom: 8px; font-weight: 500;">Number of questions:</label>
                    <select id="num-questions" style="padding: 8px 12px; font-size: 1rem; border: 1px solid #3a3a3a; border-radius: 4px; background: #2a2a2a; color: #e0e0e0; cursor: pointer;">
                        <option value="1">1 question</option>
                        <option value="2">2 questions</option>
                        <option value="3">3 questions</option>
                        <option value="4">4 questions</option>
                        <option value="5" selected>5 questions</option>
                    </select>
                </div>
                
                <button id="start-btn" class="btn btn-primary">Start Exam</button>
            </div>
        </section>

        <!-- Exam Section: Question display and answer selection -->
        <section id="exam-section" class="section">
            <div class="card">
                <div id="question-header">
                    <span id="question-counter">Question 1 of 5</span>
                </div>
                
                <div id="question-content">
                    <h2 id="question-text">Loading question...</h2>
                    
                    <div id="options-container">
                        <!-- Radio button options will be inserted here by JavaScript -->
                    </div>
                </div>

                <div id="exam-actions">
                    <button id="next-btn" class="btn btn-primary">Next Question</button>
                    <button id="submit-btn" class="btn btn-success" style="display: none;">Submit Exam</button>
                </div>

                <div id="error-message" class="error-message" style="display: none;"></div>
            </div>
        </section>

        <!-- Results Section: Score and answer review -->
        <section id="results-section" class="section">
            <div class="card">
                <h2>Exam Results</h2>
                
                <div id="score-summary">
                    <!-- Score will be inserted here -->
                </div>

                <div id="results-details">
                    <!-- Detailed results table will be inserted here -->
                </div>

                <div id="results-actions">
                    <button id="new-exam-btn" class="btn btn-primary">Take Another Exam</button>
                </div>
            </div>
        </section>
    </div>

    <!-- Confidence Modal: Appears after each answer -->
    <div id="confidence-modal" class="modal" style="display: none;">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <p id="confidence-selected-answer">You selected: <strong></strong></p>
            </div>
            
            <div class="modal-body">
                <h3>How confident are you in your answer?</h3>
                
                <div class="confidence-slider-container">
                    <div class="confidence-slider-labels">
                        <span>0%</span>
                        <span>50%</span>
                        <span>100%</span>
                    </div>
                    <input type="range" id="confidence-slider" min="0" max="100" step="5" value="50">
                    <div class="confidence-slider-value">
                        <span id="confidence-value-display">50%</span>
                    </div>
                    <button id="confirm-confidence-btn" class="btn btn-primary">Confirm</button>
                </div>
            </div>
            
            <div class="modal-footer">
                <p id="confidence-progress" class="text-muted"></p>
            </div>
        </div>
    </div>

    <script src="/app.js?v=3"></script>
</body>
</html>
