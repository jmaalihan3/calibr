<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Formatting Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #e0e0e0;
        }
        .question {
            background: #2a2a2a;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        .question-text {
            font-size: 1.1em;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .option {
            margin: 8px 0;
            padding: 10px;
            background: #333;
            border-radius: 4px;
        }
        .correct {
            border-left: 4px solid #28a745;
        }
    </style>
</head>
<body>
    <h1>Exam Formatting Test</h1>
    <p>Showing all 20 questions from database:</p>
    <div id="questions"></div>

    <script>
        async function loadQuestions() {
            try {
                const response = await fetch('/api/exams/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ num_questions: 20 })
                });
                
                const data = await response.json();
                const container = document.getElementById('questions');
                
                data.questions.forEach((q, i) => {
                    const div = document.createElement('div');
                    div.className = 'question';
                    const unitInfo = q.unit ? `<div style="color: #888; font-size: 0.9em; margin-bottom: 5px;">Unit ${q.unit}: ${q.unit_name}</div>` : '';
                    div.innerHTML = `
                        <div style="color: #4a9eff; font-weight: bold;">Question ${i+1} (ID: ${q.id})</div>
                        ${unitInfo}
                        <div class="question-text">${q.question_text}</div>
                        <div class="option">A) ${q.options[0]}</div>
                        <div class="option">B) ${q.options[1]}</div>
                        <div class="option">C) ${q.options[2]}</div>
                        <div class="option">D) ${q.options[3]}</div>
                    `;
                    container.appendChild(div);
                });
            } catch (error) {
                document.getElementById('questions').innerHTML = `<div style="color: red;">Error: ${error.message}</div>`;
            }
        }
        
        loadQuestions();
    </script>
</body>
</html>
