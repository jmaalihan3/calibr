<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confidence vs Performance Test</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Confidence vs. Performance Test</h1>
        </header>

        <section class="section active">
            <div class="card">
                <h2>Exam Results</h2>
                
                <div>
                    <h3 style="font-size: 1.2rem; color: #e0e0e0; margin-bottom: 15px;">Accuracy</h3>
                    <div class="score">1 / 3</div>
                    <div class="percentage">33.33%</div>
                </div>

                <!-- Test the comparison bars -->
                <div class="calibration-comparison">
                    <h3>Confidence vs. Performance</h3>
                    
                    <div class="comparison-bar-container">
                        <div class="comparison-label">
                            <span class="comparison-label-text">Average Confidence</span>
                            <span class="comparison-label-value" style="color: #4a9eff;">50.0%</span>
                        </div>
                        <div class="comparison-bar-background">
                            <div class="comparison-bar-fill comparison-bar-confidence" style="width: 50%;"></div>
                        </div>
                    </div>
                    
                    <div class="comparison-bar-container">
                        <div class="comparison-label">
                            <span class="comparison-label-text">Actual Accuracy</span>
                            <span class="comparison-label-value" style="color: #28a745;">33.3%</span>
                        </div>
                        <div class="comparison-bar-background">
                            <div class="comparison-bar-fill comparison-bar-accuracy" style="width: 33.3%;"></div>
                        </div>
                    </div>
                    
                    <div class="comparison-difference overconfident">
                        <div class="comparison-difference-label">Difference</div>
                        <div class="comparison-difference-value">
                            +16.7 percentage points
                        </div>
                        <div class="comparison-difference-interpretation">
                            📈 Overconfidence
                        </div>
                    </div>
                </div>

            </div>
        </section>
    </div>
</body>
</html>
